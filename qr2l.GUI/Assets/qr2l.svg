<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- qr2l application icon: a QR finder square, two pixels and a wrench, on a rounded white tile -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>

  <g fill="#111827">
    <!-- finder pattern in the top-left corner: ring and core -->
    <path fill-rule="evenodd" d="M36 36h96v96H36z M50 50v68h68V50z"/>
    <rect x="64" y="64" width="40" height="40"/>

    <!-- two pixels -->
    <rect x="176" y="44" width="32" height="32"/>
    <rect x="44" y="176" width="32" height="32"/>
  </g>

  <!-- wrench: head towards the bottom-right corner, white halo separates it from the modules -->
  <g transform="translate(132 128) rotate(-45) scale(1.4)">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-13" y="-62" width="26" height="104" rx="13"/>
      <path d="M-18 91.2A36 36 0 1 1 18 91.2L12 91.2L12 66L-12 66L-12 91.2Z"/>
    </g>
    <g fill="#111827">
      <rect x="-13" y="-62" width="26" height="104" rx="13"/>
      <path d="M-18 91.2A36 36 0 1 1 18 91.2L12 91.2L12 66L-12 66L-12 91.2Z"/>
    </g>
  </g>
</svg>
