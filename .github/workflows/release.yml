name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run tests on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test qr2l.Tests/qr2l.Tests.csproj --nologo

  # Both packages are built on every push, so packaging problems surface before a release
  build-windows:
    name: Build Windows package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build distribution package
        shell: pwsh
        run: .\build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: bin/qr2l-v*-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build distribution package
        run: ./build.sh Release linux-x64

      - name: Smoke test the published CLI
        run: |
          mkdir -p smoke && tar -xzf bin/qr2l-v*-linux-x64.tar.gz -C smoke
          ./smoke/qr2l "https://github.com/stefanocaronia/qr2l" smoke/test.png --logo=qr2l.GUI/Assets/app.ico
          test -s smoke/test.png

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: bin/qr2l-v*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: qr2l v${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

  update-winget:
    name: Update winget package
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit winget version update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN secret not set, skipping winget update"
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\wingetcreate.exe update StefanoCaronia.qr2l `
            --version $version `
            --urls "https://github.com/stefanocaronia/qr2l/releases/download/${{ github.ref_name }}/qr2l-v$version-win-x64.zip" `
            --submit --token $env:WINGET_TOKEN

  deploy-pages:
    name: Deploy HTML version to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp html/qrcode.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
