name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build distribution package
        shell: pwsh
        run: .\build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: qr2l v${{ github.ref_name }} (Windows x64)
          files: bin/qr2l-v*-win-x64.zip
          generate_release_notes: true

  update-winget:
    name: Update winget package
    runs-on: windows-latest
    needs: build-release
    steps:
      - name: Submit winget version update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN secret not set, skipping winget update"
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\wingetcreate.exe update StefanoCaronia.qr2l `
            --version $version `
            --urls "https://github.com/stefanocaronia/qr2l/releases/download/${{ github.ref_name }}/qr2l-v$version-win-x64.zip" `
            --submit --token $env:WINGET_TOKEN

  deploy-pages:
    name: Deploy HTML version to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp html/qrcode.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
